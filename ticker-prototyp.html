<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwerks-Ticker</title>
<meta name="description" content="Was das Handwerk politisch fordert - geb&uuml;ndelt aus Kammern, Zentralverband und Junioren.">
<!-- Als App installierbar: Kennzeichen, Symbole und Farbe der Titelleiste.
     Beim Oeffnen einer heruntergeladenen Datei laufen diese Verweise ins
     Leere - das stoert nicht, die Seite funktioniert vollstaendig. -->
<meta name="theme-color" content="#073070">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handwerk">
<style>
  /* ------------------------------------------------------------------
     Farben und Formen stammen aus dem Live-CSS der Handwerkskammer
     Potsdam (style/cdi21/custom.css) und aus dem Styleguide der
     Handwerkskammern. Sie sind gemessen, nicht geschaetzt.

     Grundsatz der Kammer: HELL. Seitenflaeche #f3f6fa, Inhalt auf
     weissen Kacheln mit weichem Grauschatten, ohne runde Ecken
     (die Kammer setzt durchgehend border-radius:0). Dunkelblau ist
     Schriftfarbe, Kopfband und Zustandsfarbe - keine grosse Flaeche.

     Kontrast: Weisse Schrift steht nur auf #073070 (12,6:1) oder
     #b8003f (6,8:1). Auf Hellblau #408fe5 erreicht Weiss nur 3,3:1
     und auf Orange #ff8d25 nur 2,3:1 - beides wird hier nie als
     Schriftgrund benutzt.
     ------------------------------------------------------------------ */
  :root{
    --blau:#073070;           /* Kopfband, Ueberschriften, aktiver Reiter */
    --blau-tief:#11447b;
    --blau-link:#1964b6;      /* Links: 5,93:1 auf Weiss */
    --blau-akzent:#408fe5;    /* nur Flaeche und Linie, nie Schrift */
    --blau-flaeche:#d0e3f9;
    --blau-zart:#e8f1fc;
    --seite:#f3f6fa;
    --weiss:#ffffff;
    --grau-flaeche:#efefef;
    --linie:#dfe4ea;
    --text:#444444;
    --text-stark:#252525;
    --text-leise:#5a5a5a;
    --rot:#b8003f;            /* Kammer-Ampel: wichtig */
    --orange:#ff8d25;         /* Kammer-Ampel: Hinweis */
    --orange-zart:#ffe2c8;
    --gelb:#ffc51a;
    --grau-blau:#8397b7;
    --schatten:1px 1px 6px rgba(127,127,127,.3);
    --schatten-hoch:1px 1px 12px rgba(127,127,127,.55);
  }
  *{box-sizing:border-box}
  /* "1fr" heisst minmax(auto,1fr) und kann nicht unter die Inhaltsbreite
     schrumpfen - ein einziges langes Wort sprengt sonst das Handy-Layout
     (KMS [L-0163]). Deshalb pauschal fuer alle Rasterkinder. */
  .kennzahlen>*,.kacheln>*,.forderungs-reihe>*{min-width:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  /* Damit der Sprung zur Themenwahl nicht direkt an der Oberkante klebt */
  #abschnittThemen{scroll-margin-top:10px}
  body{
    margin:0;
    background:var(--seite);
    color:var(--text);
    /* Die Hausschrift TheSans ist lizenzpflichtig. Segoe UI, San Francisco
       und Roboto liegen ihr im Buchstabenbild am naechsten; Calibri steht
       als Office-Hausschrift der Kammer dahinter. Kein CDN-Webfont. */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue",Calibri,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  h1,h2,h3{
    margin:0;font-weight:700;line-height:1.25;color:var(--text-stark);
    hyphens:auto;overflow-wrap:break-word;
  }
  a{color:var(--blau-link)}
  a:hover,a:focus{color:var(--blau);text-decoration:underline}
  :focus-visible{outline:3px dashed var(--blau);outline-offset:3px}
  .mitte{max-width:1180px;margin:0 auto;padding:0 20px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
      white-space:nowrap}

  /* ---------- Kopfband: schmal, wie die Navigationsleiste der Kammer ---------- */
  .kopfband{background:var(--blau);color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .kopf-innen{display:flex;align-items:center;justify-content:space-between;
              gap:16px;min-height:66px;padding-top:12px;padding-bottom:12px}
  .kopfband h1{color:#fff;font-size:26px;letter-spacing:-.01em}
  .kopfband .stand{margin:0;font-size:14px;color:#cddcf0;text-align:right;flex:0 0 auto}
  .kopfband .stand b{color:#fff;font-size:15px;white-space:nowrap}
  /* Der Takt der Automatik gehoert sichtbar auf die Seite: Wer das Datum
     liest, soll ohne Nachfrage wissen, wann das naechste Mal nachgesehen
     wird. */
  .kopfband .stand .takt{display:block;font-size:12px;color:#cddcf0;
                         margin-top:2px}

  /* ---------- Kennzeile ----------
     Vier Kachelkaesten kosteten 200 Pixel und vier Rahmen, um vier Zahlen zu
     zeigen. Eine Zeile tut dasselbe. */
  .kennzeile{margin:14px 0 0;font-size:14px;color:var(--text-leise);
             background:var(--weiss);box-shadow:var(--schatten);
             padding:11px 16px;line-height:1.7}
  .kennzeile b{color:var(--blau);font-size:17px}
  .kennzeile .neu-zahl{background:var(--gelb);color:var(--blau);font-weight:700;
                       padding:1px 7px;white-space:nowrap}
  /* Der Trenner ist Text, also muss er lesbar sein - in #dfe4ea waren es
     1,28:1. */
  .kennzeile .trenner{color:var(--text-leise);padding:0 5px}

  /* ---------- Hinweis "als App" ----------
     Erscheint nur, wenn das Geraet die Installation wirklich anbietet, und
     nur so lange, bis er einmal weggetippt wurde. */
  /* Ein Element mit dem Merkmal "hidden" MUSS verschwinden. Ohne diese Zeile
     gewinnt jede eigene display-Regel (hier display:flex der Hinweisleiste)
     gegen die eingebaute Regel des Browsers - die Leiste stand dann leer und
     ohne Text auf der Seite. */
  [hidden]{display:none !important}

  .appleiste{margin:10px 0 0;background:var(--blau-zart);
             border-left:4px solid var(--blau-akzent);
             box-shadow:var(--schatten);padding:9px 14px;display:flex;
             flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;
             color:var(--text-stark);line-height:1.5}
  .appleiste .text{flex:1 1 230px}
  .appleiste button{font:inherit;min-height:44px;border:0;cursor:pointer}
  .appleiste .ja{background:var(--blau);color:#fff;font-weight:700;padding:0 18px}
  .appleiste .ja:hover{background:var(--blau-tief)}
  .appleiste .nein{background:transparent;color:var(--blau-link);
                   text-decoration:underline;padding:0 10px}

  /* ---------- Warnung "Abgleich haengt" ----------
     Eine Automatik faellt still aus. Deshalb sagt die Seite selbst Bescheid,
     sobald der letzte Abgleich zu lange her ist - sonst merkt es niemand. */
  .haengt{margin:10px 0 0;background:var(--orange-zart);
          border-left:4px solid var(--orange);box-shadow:var(--schatten);
          padding:10px 14px;font-size:14px;color:var(--text-stark);
          line-height:1.5}

  /* ---------- Abschnittsueberschriften ---------- */
  .abschnitt{padding:28px 0 0}
  .abschnitt-titel{font-size:24px;color:var(--blau);margin:0}
  .abschnitt-unter{margin:4px 0 0;font-size:14px;color:var(--text-leise)}

  /* ---------- Die drei Forderungen ---------- */
  /* auto-fit statt fester Spaltenzahl: Die Reihe traegt drei oder vier
     Forderungen, ohne dass das CSS davon wissen muss. */
  .forderungs-reihe{display:grid;gap:4px;margin-top:16px;
                    grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .forderung{background:var(--weiss);box-shadow:var(--schatten);
             border-left:5px solid var(--rot);padding:0;min-width:0}
  .forderung summary{cursor:pointer;list-style:none;display:block;padding:12px 15px}
  .forderung summary::-webkit-details-marker{display:none}
  .forderung summary:hover{background:var(--blau-zart)}
  .forderung-kopf{display:flex;align-items:flex-start;gap:9px}
  .forderung-rang{flex:0 0 auto;background:var(--rot);color:#fff;font-size:14px;
                  font-weight:700;width:26px;height:26px;line-height:26px;
                  text-align:center}
  .forderung-titel{font-size:18px;font-weight:700;color:var(--blau);
                   line-height:1.3;hyphens:auto;overflow-wrap:break-word}
  .forderung-zeile{margin:8px 0 0 35px;display:flex;flex-wrap:wrap;gap:5px;
                   align-items:center}
  .marke{display:inline-block;font-size:12px;line-height:1.4;padding:3px 8px;
         white-space:nowrap}
  /* "an Bund und Land Brandenburg" ist zu lang fuer eine Zeile, die nicht
     umbrechen darf - auf schmalen Geraeten schiebt sie sonst die Seite auf. */
  .marke.adressat{background:var(--blau);color:#fff;font-weight:700;
                  white-space:normal}
  .marke.beide{background:var(--blau-flaeche);color:var(--blau);font-weight:700}
  .marke.wann{background:var(--grau-flaeche);color:var(--text-stark)}
  .forderung-mehr{font-size:12px;line-height:1.4;padding:3px 8px;
                  color:var(--blau-link);text-decoration:underline;
                  white-space:nowrap}
  .forderung-inhalt{padding:0 15px 14px 35px}
  .forderung-inhalt p.worum{margin:0;font-size:15px;line-height:1.5}
  .forderung blockquote{margin:12px 0 0;padding:10px 14px;background:var(--blau-zart);
                        border-left:3px solid var(--blau-akzent);font-size:15px;
                        color:var(--text-stark)}
  /* Tippflaeche 44px auch fuer die Links in den Belegen (KMS [D-0176]) */
  .beleg{margin:0;font-size:13px;color:var(--text-leise);
         display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-height:44px}
  .beleg a{display:inline-flex;align-items:center;min-height:44px}

  /* ---------- Themenkacheln ----------
     Die Themen stehen nur noch HIER. Vorher gab es sie doppelt - als Kachel
     und als Knopf in einer 2.963 Pixel breiten Leiste. Zwei Wege zum selben
     Ziel sind keine Auswahl, sondern Unordnung. */
  .kacheln{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
  .kachel{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
          background:var(--weiss);box-shadow:var(--schatten);border:0;
          border-top:3px solid var(--blau);padding:11px 14px 10px;min-width:0}
  .kachel:hover{box-shadow:var(--schatten-hoch)}
  .kachel.nachrangig{border-top-color:var(--grau-blau)}
  .kachel[aria-pressed="true"]{background:var(--blau);border-top-color:var(--blau)}
  .kachel[aria-pressed="true"] .kachel-name{color:#fff}
  .kachel[aria-pressed="true"] .kachel-zeile,
  .kachel[aria-pressed="true"] .kachel-herkunft{color:#e2ecf9}
  /* Wird es eng, rutschen die Marken unter den Namen, statt die Kachel um
     ein paar Pixel ueber den Bildschirmrand zu schieben. */
  .kachel-kopf{display:flex;align-items:baseline;justify-content:space-between;
               gap:6px 8px;flex-wrap:wrap}
  /* break-word statt anywhere: anywhere bricht AUCH dort, wo ein normaler
     Umbruch reichen wuerde - aus "Auftraege & Konjunktur" wurde dadurch
     "Auftraeg e & Konjunk tur". */
  .kachel-name{flex:1 1 auto;min-width:0;font-size:17px;font-weight:700;
               color:var(--blau);line-height:1.25;
               hyphens:auto;overflow-wrap:break-word;word-break:normal}
  .kachel-marken{flex:0 0 auto;display:flex;align-items:baseline;gap:4px}
  .kachel-zahl{background:var(--blau-flaeche);color:var(--blau);
               font-size:13px;font-weight:700;padding:1px 8px;border-radius:0}
  .kachel-neu{background:var(--gelb);color:var(--blau);font-size:12px;
              font-weight:700;padding:1px 7px;border-radius:0;white-space:nowrap}
  .kachel.nachrangig .kachel-zahl{background:var(--grau-flaeche);color:var(--text-stark)}
  /* Die juengste Schlagzeile auf zwei Zeilen begrenzen - sonst bestimmt die
     laengste Ueberschrift die Hoehe der ganzen Reihe. */
  .kachel-zeile{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                overflow:hidden;font-size:13px;line-height:1.35;color:var(--text);
                margin-top:6px;overflow-wrap:break-word;hyphens:auto}
  .kachel-herkunft{display:block;margin-top:5px;font-size:12px;
                   color:var(--text-leise)}

  /* ---------- Statuszeile: klebt, feste Hoehe ---------- */
  .statusband{position:sticky;top:0;z-index:20;background:var(--weiss);
              border-top:2px solid var(--blau);border-bottom:1px solid var(--linie);
              margin-top:22px;box-shadow:0 2px 4px rgba(0,0,0,.06)}
  .statuszeile{display:flex;align-items:center;justify-content:space-between;
               gap:12px;height:52px}
  .zaehler{font-size:14px;color:var(--text-stark);margin:0;min-width:0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zaehler b{color:var(--blau)}
  .zurueck{flex:0 0 auto;border:0;border-radius:0;font:inherit;font-size:14px;
           font-weight:700;cursor:pointer;background:var(--grau-flaeche);
           color:var(--blau);height:44px;padding:0 14px;white-space:nowrap}
  .zurueck:hover{background:var(--blau-flaeche)}

  /* ---------- Werkzeuge: Suche und Eingrenzen ---------- */
  .werkzeuge{margin:16px 0 18px}
  .werkzeuge input{width:100%;font:inherit;font-size:16px;padding:11px 14px;
                   min-height:46px;border:1px solid var(--text);border-radius:0;
                   background:var(--weiss);color:var(--text)}
  .werkzeuge input:hover{border-color:var(--blau-akzent)}
  .werkzeuge input::placeholder{color:var(--text-leise)}
  .eingrenzen{margin-top:4px;background:var(--weiss);box-shadow:var(--schatten)}
  .eingrenzen>summary{cursor:pointer;list-style:none;display:flex;
                      align-items:center;min-height:44px;padding:0 14px;
                      font-size:14px;font-weight:700;color:var(--blau)}
  .eingrenzen>summary::-webkit-details-marker{display:none}
  /* EIN Backslash. Mit zweien ist es in CSS ein maskierter Backslash plus
     der Text "25bc" - und genau das stand monatelang als "\25bc" neben der
     Ueberschrift, statt eines Dreiecks. */
  .eingrenzen>summary::after{content:"\25bc";margin-left:8px;font-size:10px;
                             color:var(--text-leise)}
  .eingrenzen[open]>summary::after{content:"\25b2"}
  .eingrenzen>summary:hover{background:var(--blau-zart)}
  /* Die Knoepfe BRECHEN UM statt seitwaerts zu scrollen - niemand sucht einen
     Filter, den er erst wegschieben muss. */
  .chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 14px}
  .reiter{border:0;border-radius:0;font:inherit;font-size:14px;font-weight:700;
          cursor:pointer;white-space:nowrap;padding:0 13px;
          background:var(--grau-flaeche);color:var(--blau);min-height:44px;
          height:44px;line-height:44px}
  .reiter:hover{background:var(--blau-flaeche);color:var(--blau)}
  .reiter[aria-pressed="true"]{background:var(--blau);color:#fff}
  .reiter .zahl{font-weight:400;opacity:.85;margin-left:6px}
  .reiter.hinweis{background:var(--orange-zart);color:var(--blau)}
  .reiter.hinweis[aria-pressed="true"]{background:var(--blau);color:#fff}
  .reiter.quelle{background:var(--weiss);color:var(--blau);
                 box-shadow:inset 0 0 0 1px var(--blau)}
  .reiter.quelle:hover{background:var(--blau-flaeche)}
  .reiter.quelle[aria-pressed="true"]{background:var(--blau);color:#fff}
  .chips .zwischentitel{flex:0 0 100%;font-size:12px;color:var(--text-leise);
                        margin:8px 0 2px;letter-spacing:.04em;text-transform:uppercase}

  /* ---------- Liste ---------- */
  main{padding-bottom:44px}
  .block-titel{display:flex;align-items:center;gap:10px;margin:26px 0 10px;
               font-size:20px;color:var(--blau)}
  .block-titel:first-child{margin-top:0}
  .block-zahl{background:var(--blau-flaeche);color:var(--blau);font-size:13px;
              font-weight:700;padding:2px 9px;border-radius:0}
  .block-mehr{display:block;width:100%;margin:0 0 6px;padding:12px;min-height:44px;
              background:var(--weiss);box-shadow:var(--schatten);border:0;
              border-radius:0;font:inherit;font-size:15px;font-weight:700;
              color:var(--blau-link);cursor:pointer;text-align:center}
  .block-mehr:hover{box-shadow:var(--schatten-hoch)}

  /* Farbregel der Kammer-Ampel: Rot heisst "wichtig" und bleibt deshalb den
     drei belegten Forderungen vorbehalten. Politische Meldungen tragen das
     Akzentblau als Flaeche, neue Meldungen das Gelb der Neu-Marke. */
  .karte{background:var(--weiss);box-shadow:var(--schatten);padding:14px 18px 12px;
         margin-bottom:4px;border-left:5px solid transparent}
  .karte.politisch{border-left-color:var(--blau-akzent)}
  .karte.ist-neu{border-left-color:var(--gelb)}
  .karte-dach{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;
              font-size:12px}
  .ebene{padding:3px 8px;font-weight:700;white-space:nowrap}
  .ebene-bund{background:var(--blau);color:#fff}
  /* Zweites Merkmal neben der Farbe, damit die Ebene auch in Graustufen und
     bei Farbsehschwaeche unterscheidbar bleibt. */
  .ebene-land{background:var(--blau-flaeche);color:var(--blau);
              box-shadow:inset 0 0 0 1px var(--blau)}
  .neu-marke{background:var(--gelb);color:var(--blau);font-weight:700;padding:3px 8px}
  .gattung{background:var(--grau-flaeche);color:var(--text-stark);padding:3px 8px}
  /* Die zweite Stimme: Was das Ministerium sagt, darf keine Sekunde lang wie
     eine Forderung des Handwerks aussehen. Deshalb ein dunkel gefuelltes
     Schild - deutlich anders als die blauen Schilder des Handwerks - und eine
     leicht abgesetzte Kartenflaeche. */
  .gegenseite-marke{background:var(--text-stark);color:#fff;padding:3px 8px;
                    font-weight:700;white-space:nowrap}
  .karte.gegenseite{background:#f7f8fa}
  .thema{color:var(--text-leise)}
  .datum{margin-left:auto;color:var(--text-leise);white-space:nowrap}
  .ungenau{border-bottom:1px dotted var(--text-leise);cursor:help}
  .schlagzeile{font-size:20px;color:var(--blau);margin:0 0 6px;line-height:1.3}
  .dreizeiler{margin:0;font-size:15px;line-height:1.5}
  .quelle-marke{display:inline-block;background:var(--grau-flaeche);
                color:var(--text-leise);font-size:12px;padding:2px 7px;
                margin-left:4px;vertical-align:1px;white-space:nowrap}
  .karte blockquote{margin:10px 0 0;padding:9px 13px;background:var(--blau-zart);
                    border-left:3px solid var(--blau-akzent);font-size:15px;
                    color:var(--text-stark)}
  .karte-fuss{display:flex;flex-wrap:wrap;gap:0 14px;align-items:center;
              margin:8px 0 0;padding-top:0;border-top:1px solid var(--linie);
              font-size:13px}
  .original{font-weight:700;min-height:44px;display:inline-flex;align-items:center}
  .absender{color:var(--text-leise)}
  .leer{background:var(--weiss);box-shadow:var(--schatten);padding:22px 18px;
        font-size:16px}

  .nebensache{background:var(--weiss);box-shadow:var(--schatten);margin-top:26px}
  .nebensache>summary{cursor:pointer;list-style:none;padding:15px 18px;
                      font-size:18px;font-weight:700;color:var(--blau);
                      display:flex;align-items:center;gap:10px;min-height:44px}
  .nebensache>summary::-webkit-details-marker{display:none}
  .nebensache>summary:hover{background:var(--blau-zart)}
  .nebensache-inhalt{padding:0 4px 4px}
  .nebensache-hinweis{margin:0 14px 10px;font-size:14px;color:var(--text-leise)}

  footer{background:var(--weiss);border-top:2px solid var(--blau);padding:22px 0 30px;
         font-size:13px;color:var(--text-leise)}
  footer p{margin:0 0 6px;max-width:750px}

  /* ---------- Tablet ---------- */
  @media (max-width:1000px){
    .kacheln{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:900px){
    .forderungs-reihe{grid-template-columns:1fr}
    .kacheln{grid-template-columns:repeat(2,1fr)}
  }
  /* ---------- Handy ---------- */
  @media (max-width:767px){
    body{font-size:16px}
    h1,h2,h3,.forderung-titel{overflow-wrap:anywhere}
    .mitte{padding:0 16px}
    .kopf-innen{flex-direction:column;align-items:flex-start;gap:2px;
                min-height:56px;padding-top:9px;padding-bottom:9px}
    .kopfband h1{font-size:22px}
    .kopfband .stand{text-align:left;font-size:13px}
    .kennzeile{font-size:13px;padding:10px 14px;line-height:1.8}
    .kennzeile b{font-size:16px}
    .abschnitt-titel{font-size:21px}
    /* Zwei Spalten auch am Handy: neun Kacheln untereinander waren allein
       1.463 Pixel hoch - fast zwei Bildschirme vor der ersten Meldung. */
    .kacheln{grid-template-columns:repeat(2,1fr)}
    .kachel{padding:10px 12px 9px}
    .kachel-name{font-size:15px}
    .kachel-zeile{font-size:12px;-webkit-line-clamp:3}
    .kachel-herkunft{font-size:12px}
    .statuszeile{height:48px}
    .nur-breit{display:none}
    .schlagzeile{font-size:18px}

   "dreizeiler": "„Bau Dir Deinen Sommer!“ – Der zweite Durchgang des Sommercamps der Handwerkskammer Cottbus eröffnet mit 20 Jugendlichen ab 14 Jahren neue Perspektiven. In der Zimmererwerkstatt bauen die Jugendlichen einen Schwedenstuhl, das Fliesenlegerhandwerk gibt Einblick in die Arbeit mit Naturstein, Fliesen und Mosaik, die Stuckateurwerkstatt weckt künstlerische Fähigkeiten in Verbindung mit dem Malerhandwerk. Zusätzlich entdecken die Feriengäste das Fleischerhandwerk und erleben hier das Handwerk von der Zerlegung bis zur Burgerproduktion. Jeden Nachmittag warten Abenteuer auf die Jugendlichen wie Paddeln, Tagebau-Tour und Freibad. Neben Teamgeist, Selbstvertrauen und Kreativität vermittelt das Camp vielseitige Einblicke ins Handwerk. Dr. Klaus Freytag (3.v.l.), Lausitz-Beauftragter des Ministerpräsidenten, besuchte die Campteilnehmer, um die Atmosphäre zu erleben: „Das Sommercamp der Handwerkskammer bietet eine fantastische Orientierung für junge Lausitzerinnen und Lausitzer in der Vielfalt des Handwerks. Dabei kommt auch der Freizeitgedanke nicht zu kurz. Wer dieses Jahr keinen Platz ergattern konnte, sollte sich das Camp für 2027 vormerken.“",

/* Pflicht bei jedem innerHTML: Sonderzeichen entschaerfen (KMS [L-0024]) */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

const MONATE = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

/* Ohne Absicherung reisst eine einzige Meldung ohne Datum die ganze Liste ab. */
function datumLesbar(iso){
  if (!iso || typeof iso !== "string") return "ohne Datum";
  const t = iso.split("-");
  if (t.length !== 3) return "ohne Datum";
  const monat = MONATE[parseInt(t[1],10) - 1];
  if (!monat) return "ohne Datum";
  return parseInt(t[2],10) + ". " + monat + " " + t[0];
}
function datumKurz(iso){
  if (!iso || typeof iso !== "string") return "";
  const t = iso.split("-");
  if (t.length !== 3) return "";
  const monat = MONATE[parseInt(t[1],10) - 1];
  if (!monat) return "";
  return parseInt(t[2],10) + ". " + monat.slice(0,3) + ".";
}

   WICHTIG: Jede Meldung zaehlt genau einmal, naemlich ueber ihr
   Hauptthema. Nur so stimmt die Zahl auf dem Knopf mit dem ueberein,
   was nach dem Klick erscheint (KMS [L-0238]).
   ------------------------------------------------------------------ */
const BUENDEL = [
  {name:"Geld & Steuern",
   themen:["Steuern & Abgaben","Sozialabgaben & Rente","Energie & Sprit"]},
  {name:"Nachwuchs & Personal",
   themen:["Ausbildung & Nachwuchs","Personal & Fachkräfte","Arbeitszeit & Arbeitsrecht"]},
  {name:"Aufträge & Konjunktur",
   themen:["Wirtschaftslage","Aufträge & Vergabe","Bauen & Sanieren"]},
  {name:"Papierkram & Vorschriften",
   themen:["Entbürokratisierung","Auflagen & Vorschriften"]},
  {name:"Betrieb & Zukunft",
   themen:["Betrieb & Nachfolge"]},
  {name:"Politik & Regierung",
   themen:["Politik & Regierung","Noch nicht eingeordnet"]},
  /* Das Verbandsleben der Handwerksjunioren: eigene Veranstaltungen,
     Ehrenamt, Auszeichnungen. Keine politische Forderung, aber auch keine
     Nebensache - deshalb vor den Ehrungen und nicht zugeklappt. */
  {name:"Junges Handwerk",
   themen:["Junioren & Ehrenamt"]},
  /* Die Gegenseite: Meldungen des Wirtschaftsministeriums, die zu keinem
     Sachthema des Handwerks passen - Regierungsarbeit von Tourismus bis
     Innovationspreis. Was zu einem Sachthema passt, steht NICHT hier, sondern
     direkt neben der Forderung des Handwerks. Genau dort gehoert es hin. */
  {name:"Aus der Landesregierung", kein_sachthema:true, zugeklappt:true,
   hinweis:"Meldungen des Wirtschaftsministeriums ohne Bezug zu einem " +
           "Handwerksthema. Was das Ministerium zu Ausbildung, Energie oder " +
           "Bürokratie sagt, steht oben beim jeweiligen Thema.",
   themen:["Aus der Landesregierung"]},
  /* Regionale Berichterstattung der drei Kammern: Betriebsbesuche,
     Lehrberufeschauen, Gremienarbeit. Kein Sachthema - und es waere falsch,
     ihr eines anzudichten, nur damit die Kachelwand voller aussieht. */
  {name:"Aus den Kammern", kein_sachthema:true, zugeklappt:true,
   hinweis:"Betriebsbesuche, Lehrberufeschauen, Gremienarbeit und Dienste der " +
           "drei Kammern. Wichtig für die Region, aber keine politische " +
           "Forderung – deshalb hier unten.",
   themen:["Aus den Kammern","Kammer & Service"]},
  {name:"Ehrungen & Termine", nachrangig:true, kein_sachthema:true,
   zugeklappt:true,
   hinweis:"Jubiläen, Freisprechungen und Veranstaltungstermine.",
   themen:["Ehrungen & Termine"]}
];

/* Wer sagt es? Die Ebene (Bund/Brandenburg) beantwortet das nur halb:
   ZDH und Handwerksjunioren sind beide Bundesebene, aber zwei sehr
   verschiedene Absender. */
const QUELLEN = [
  {schluessel:"Kammer",          name:"Potsdam"},
  {schluessel:"Kammer Frankfurt", name:"Frankfurt (Oder)"},
  {schluessel:"Kammer Cottbus",  name:"Cottbus"},
  {schluessel:"ZDH",             name:"ZDH"},
  {schluessel:"Junioren",        name:"Junioren"},
  {schluessel:"Ministerium",     name:"Ministerium", gegenseite:true}
];

/* Selbstkontrolle: Ein Thema, das in keinem Buendel steht, wuerde sonst
   spurlos verschwinden. Es bekommt stattdessen ein eigenes Buendel. */
(function buendelPruefen(){
  const bekannt = {};
  BUENDEL.forEach(b => b.themen.forEach(t => bekannt[t] = true));
  const offen = [];
  DATEN.meldungen.forEach(m => {
    if (!bekannt[m.thema] && offen.indexOf(m.thema) === -1) offen.push(m.thema);
  });
  if (offen.length){
    BUENDEL.splice(BUENDEL.length - 1, 0, {name:"Weitere Themen", themen:offen});
    if (window.console) console.warn("Ohne Oberthema, eigenes Buendel gebildet:", offen);
  }
})();

/* Zwei Texte gelten als gleich, wenn sie sich nur in Satzzeichen,
   Leerraum und Gross-/Kleinschreibung unterscheiden. */
function gleicherText(a, b){
  const k = s => String(s || "").toLowerCase()
    .replace(/[\s.,;:!?()„“«»"'–—-]+/g, "");
  return k(a) === k(b);
}

function buendelVon(m){
  for (let i = 0; i < BUENDEL.length; i++){
    if (BUENDEL[i].themen.indexOf(m.thema) !== -1) return BUENDEL[i];
  }
  return null;
}
function istPolitisch(m){ return m.art === "politik"; }

/* Zwei Stimmen stehen in diesem Ticker: Das Handwerk fordert, die
   Landesregierung antwortet. Wer das verwechselt, liest eine
   Ministeriumsmeldung als Beschluss des Handwerks. */
function vonDerGegenseite(m){ return m.seite === "Landesregierung"; }

/* ---------- Zustand ---------- */
let filter = "alles";
let suchtext = "";
const offeneBloecke = {};
const ANRISS = 3;            /* so viele Karten je Block, bevor es "mehr" gibt */

function passt(m){
  if (filter === "politik" && !istPolitisch(m)) return false;
  if (filter === "neu" && !m.neu) return false;
  if (filter.indexOf("ebene:") === 0 && m.ebene !== filter.slice(6)) return false;
  if (filter.indexOf("quelle:") === 0 && m.quelle_kurz !== filter.slice(7)) return false;
  if (filter.indexOf("buendel:") === 0){
    const b = buendelVon(m);
    if (!b || b.name !== filter.slice(8)) return false;
  }
  if (suchtext){
    const heu = (m.schlagzeile + " " + m.dreizeiler + " " + m.titel + " " +
                 m.thema + " " + (m.thema2 || "") + " " + m.absender + " " +
                 (m.zitat || "")).toLowerCase();
    if (heu.indexOf(suchtext) === -1) return false;
  }
  return true;
}

/* ---------- Kopf ---------- */
function zeichneKopf(){
  /* "Zuletzt abgeglichen" ist der Tag, an dem die Quellen zuletzt WIRKLICH
     abgefragt wurden - nicht der Tag, an dem zuletzt etwas Neues dabei war.
     Beides zu vermischen hiess: Ein Abgleich ohne Fund sah aus wie gar kein
     Abgleich. */
  document.getElementById("stand").innerHTML =
    "Zuletzt abgeglichen <b>" + esc(datumLesbar(DATEN.letzter_abgleich)) + "</b>" +
    (DATEN.abgleich_takt
       ? '<span class="takt">automatisch ' + esc(DATEN.abgleich_takt) + "</span>"
       : "");

  const M = DATEN.meldungen;
  const neu = M.filter(m => m.neu).length;
  const teile = [
    "<b>" + esc(M.length) + "</b> Meldungen " + esc(DATEN.jahr),
    "<b>" + esc(M.filter(istPolitisch).length) + "</b> politische",
    "<b>" + esc(M.filter(m => m.ebene === "Brandenburg").length) +
      "</b> aus Brandenburg, <b>" +
      esc(M.filter(m => m.ebene === "Bund").length) + "</b> vom Bund"
  ];
  /* Die Gegenstimme gehoert in die Kennzeile: Sonst wundert sich jemand,
     warum unter "Ausbildung" plötzlich das Ministerium spricht. */
  const gegen = M.filter(vonDerGegenseite).length;
  if (gegen) teile.push("<b>" + esc(gegen) + "</b> von der Landesregierung");
  if (neu) teile.push('<span class="neu-zahl">' + esc(neu) + " neu</span>");
  document.getElementById("kennzeile").innerHTML =
    teile.join('<span class="trenner">&middot;</span>');
}

/* ---------- Die drei Forderungen ---------- */
const ZAHLWORT = ["keine","eine","zwei","drei","vier","fünf","sechs",
                  "sieben","acht","neun","zehn"];

function zeichneForderungen(){
  /* Die Ueberschrift zaehlt selbst - sonst steht irgendwann "die drei"
     ueber vier Karten. */
  const n = DATEN.forderungen.length;
  document.getElementById("forderungsTitel").textContent =
    n === 1 ? "Die am häufigsten belegte Forderung"
            : "Die " + (ZAHLWORT[n] || n) +
              " am häufigsten belegten Forderungen";
  document.getElementById("kriterium").textContent = DATEN.forderungen_kriterium;

  document.getElementById("forderungsReihe").innerHTML =
    DATEN.forderungen.map((f, i) => {
      const beleg = f.belege[0];
      /* Zugeklappt so flach wie moeglich: Rang und Titel in EINER Zeile,
         darunter eine einzige Zeile mit Adressat, Datum und Belegzahl. Die
         vier Karten brauchten vorher 794 Pixel - fast einen ganzen
         Handybildschirm, bevor ueberhaupt ein Thema zu sehen war. */
      return '<details class="forderung">' +
        '<summary>' +
          '<span class="forderung-kopf">' +
            '<span class="forderung-rang">' + (i + 1) + '</span>' +
            '<span class="forderung-titel">' + esc(f.kurz) + '</span>' +
          '</span>' +
          '<span class="forderung-zeile">' +
            '<span class="marke adressat">an ' + esc(f.adressat) + '</span>' +
            '<span class="marke wann">zuletzt ' +
              esc(datumLesbar(f.zuletzt)) + '</span>' +
            '<span class="forderung-mehr">' + esc(f.anzahl) +
              (f.anzahl === 1 ? ' Beleg' : ' Belege') + '</span>' +
          '</span>' +
        '</summary>' +
        '<div class="forderung-inhalt">' +
          '<p class="worum">' + esc(f.worum) + '</p>' +
          '<blockquote>&bdquo;' + esc(beleg.zitat) + '&ldquo;</blockquote>' +
          f.belege.map(b =>
            '<p class="beleg">' + esc(b.absender) + ', ' + esc(datumLesbar(b.datum)) +
            ' &middot; <a href="' + esc(b.url) + '" target="_blank" rel="noopener">' +
            'Original lesen</a></p>').join("") +
        '</div>' +
      '</details>';
    }).join("");
}

/* ---------- Lagesatz ----------
   Ein einziger Satz, der sich aus den Daten selbst ergibt und sich mit jedem
   Abgleich aendert. Bei Gleichstand werden alle gleichauf liegenden Themen
   genannt - sonst waere die Aussage unvollstaendig. */
function aufzaehlen(namen){
  if (namen.length === 1) return namen[0];
  return namen.slice(0, -1).join(", ") + " und " + namen[namen.length - 1];
}

function zeichneLagesatz(){
  const zaehlen = f => BUENDEL
    .map(b => ({b: b, n: DATEN.meldungen.filter(m => buendelVon(m) === b && f(m)).length}))
    .filter(x => x.n > 0)
    .sort((x, y) => y.n - x.n);

  const neue = zaehlen(m => m.neu);
  let satz;
  if (neue.length){
    const spitze = neue.filter(x => x.n === neue[0].n);
    const anzahl = DATEN.meldungen.filter(m => m.neu).length;
    satz = "Beim Abgleich am " + datumLesbar(DATEN.letztes_neues ||
                                               DATEN.letzter_abgleich) + " kamen " +
      anzahl + (anzahl === 1 ? " Meldung dazu, sie gehört zu "
                             : " Meldungen dazu, die meisten zu ") +
      aufzaehlen(spitze.map(x => x.b.name)) +
      /* "je 4" ergibt nur Sinn, wenn mehrere Themen gleichauf liegen. */
      (anzahl === 1 ? "."
        : " (" + (spitze.length > 1 ? "je " : "") + spitze[0].n + ").");
  } else {
    satz = "Beim Abgleich am " + datumLesbar(DATEN.letzter_abgleich) +
      " war nichts Neues dabei.";
  }
  /* "Aus den Kammern" und "Ehrungen & Termine" sind Auffangtoepfe, keine
     Sachthemen - als "groesstes Thema" waeren sie eine leere Aussage. */
  const alle = zaehlen(() => true).filter(x => !x.b.kein_sachthema);
  if (alle.length){
    const g = alle[0];
    satz += " Größtes Sachthema " + DATEN.jahr + ": " + g.b.name +
      " mit " + g.n + " von " + DATEN.meldungen.length + " Meldungen.";
  }
  document.getElementById("lagesatz").textContent = satz;
}

/* ---------- Themenkacheln ---------- */
function zeichneKacheln(){
  const html = BUENDEL.map(b => {
    const treffer = DATEN.meldungen.filter(m => buendelVon(m) === b);
    if (!treffer.length) return "";          /* leere Kachel gar nicht erst zeigen */
    treffer.sort((x, y) => (y.datum || "").localeCompare(x.datum || ""));
    const gewaehlt = (filter === "buendel:" + b.name);
    const neu = treffer.filter(m => m.neu).length;
    return '<button type="button" class="kachel' +
             (b.nachrangig ? " nachrangig" : "") + '" ' +
             'data-filter="buendel:' + esc(b.name) + '" ' +
             'aria-pressed="' + gewaehlt + '">' +
      '<span class="kachel-kopf">' +
        '<span class="kachel-name">' + esc(b.name) + '</span>' +
        /* Die grosse Zahl ist die Jahressumme, die Schlagzeile darunter von
           gestern - ohne Beschriftung liest man das als "48 diese Woche". */
        '<span class="kachel-marken">' +
          (neu ? '<span class="kachel-neu">' + neu + ' neu</span>' : '') +
          '<span class="kachel-zahl">' + treffer.length + '</span>' +
        '</span>' +
      '</span>' +
      /* Eine einzige Schlagzeile, auf zwei Zeilen begrenzt: Sie beantwortet
         "was steckt drin", ohne die Kachelwand zu einem zweiten Inhalt zu
         machen. */
      '<span class="kachel-zeile">' + esc(datumKurz(treffer[0].datum)) +
        ' &middot; ' + esc(treffer[0].schlagzeile) + '</span>' +
      /* Die Herkunft im Klartext, nicht nur als Farbe: dass Geld & Steuern
         fast nur vom Bund kommt und Ehrungen fast nur aus Brandenburg, ist
         eine Aussage fuer sich. */
      '<span class="kachel-herkunft">' +
        treffer.filter(m => m.ebene === "Bund").length + ' Bund &middot; ' +
        treffer.filter(m => m.ebene === "Brandenburg").length + ' Brandenburg' +
      '</span>' +
    '</button>';
  }).join("");
  document.getElementById("themenKacheln").innerHTML = html;
}

/* ---------- Reiterleiste ---------- */
function zeichneFilter(){
  const knopf = (wert, beschriftung, anzahl, klasse) =>
    '<button type="button" class="reiter' + (klasse ? " " + klasse : "") + '" ' +
      'data-filter="' + esc(wert) + '" aria-pressed="' + (filter === wert) + '">' +
      esc(beschriftung) +
      (anzahl === null ? "" : '<span class="zahl">' + anzahl + '</span>') +
    '</button>';

  /* Die THEMEN stehen hier bewusst nicht mehr - die waehlt man oben an den
     Kacheln. Hier bleibt nur, was eine andere Frage beantwortet: Wer sagt es,
     auf welcher Ebene, und was ist neu. */
  const neu = DATEN.meldungen.filter(m => m.neu).length;
  let html = knopf("alles", "Alles", DATEN.meldungen.length);
  if (neu) html += knopf("neu", "Neu seit dem Abgleich", neu, "hinweis");
  html += knopf("politik", "Nur Politisches",
                DATEN.meldungen.filter(istPolitisch).length);

  html += '<span class="zwischentitel">Ebene</span>';
  ["Bund","Brandenburg"].forEach(e => {
    const n = DATEN.meldungen.filter(m => m.ebene === e).length;
    if (n) html += knopf("ebene:" + e, e, n);
  });

  html += '<span class="zwischentitel">Absender</span>';
  QUELLEN.forEach(q => {
    const n = DATEN.meldungen.filter(m => m.quelle_kurz === q.schluessel).length;
    if (n) html += knopf("quelle:" + q.schluessel, q.name, n, "quelle");
  });
  document.getElementById("filterKnoepfe").innerHTML = html;
}

/* ---------- Liste ---------- */
function zeichneListe(){
  const treffer = DATEN.meldungen.filter(passt);
  treffer.sort((a, b) => (b.datum || "").localeCompare(a.datum || ""));

  const gegliedert = (filter === "alles" && !suchtext);
  /* Nach einem Filterklick muss dastehen, WO man gelandet ist - nicht nur,
     wie viele Karten es sind. */
  let wo = "";
  if (filter.indexOf("buendel:") === 0) wo = filter.slice(8) + ": ";
  else if (filter.indexOf("ebene:") === 0) wo = filter.slice(6) + ": ";
  else if (filter.indexOf("quelle:") === 0) wo = filter.slice(7) + ": ";
  else if (filter === "politik") wo = "Politische Meldungen: ";
  else if (filter === "neu") wo = "Neu seit dem letzten Abgleich: ";
  document.getElementById("zaehler").innerHTML =
    gegliedert
      ? "Alle Themen &middot; <b>" + esc(treffer.length) + "</b> Meldungen"
      : esc(wo) + "<b>" + esc(treffer.length) + "</b> von " +
        esc(DATEN.meldungen.length) + " Meldungen";
  /* Der Knopf fuehrt zur Themenwahl zurueck - solange noch nichts gewaehlt
     ist, waere er sinnlos. */
  document.getElementById("zurueck").hidden = gegliedert;

  const ziel = document.getElementById("liste");
  if (!treffer.length){
    ziel.innerHTML = '<p class="leer">Dazu gibt es derzeit keine Meldung. ' +
      'Mit &bdquo;Alles&ldquo; kommen Sie zur vollst&auml;ndigen Liste zur&uuml;ck.</p>';
    return;
  }

  /* Gefiltert oder gesucht: eine flache Liste. Sonst nach Oberthema gegliedert. */
  if (filter !== "alles" || suchtext){
    ziel.innerHTML = treffer.map(karte).join("");
    return;
  }

  let html = "";
  BUENDEL.forEach(b => {
    if (b.zugeklappt) return;
    const teil = treffer.filter(m => buendelVon(m) === b);
    if (!teil.length) return;
    const alle = offeneBloecke[b.name];
    const zeigen = alle ? teil : teil.slice(0, ANRISS);
    html += '<h2 class="block-titel">' + esc(b.name) +
            '<span class="block-zahl">' + teil.length + '</span></h2>' +
            zeigen.map(karte).join("");
    if (teil.length > ANRISS){
      html += '<button type="button" class="block-mehr" data-block="' + esc(b.name) + '">' +
        (alle ? "Weniger anzeigen"
              : "Alle " + teil.length + " Meldungen zu &bdquo;" + esc(b.name) +
                "&ldquo; anzeigen") +
        '</button>';
    }
  });

  /* Zugeklappt ans Ende: das Kammerleben und die Ehrungen. Zusammen sind das
     fast die Haelfte aller Meldungen - offen wuerden sie die politischen
     Themen zuschuetten (KMS [D-0173]). */
  BUENDEL.filter(b => b.zugeklappt).forEach(b => {
    const teil = treffer.filter(m => buendelVon(m) === b);
    if (!teil.length) return;
    html += '<details class="nebensache">' +
      '<summary>' + esc(b.name) +
        '<span class="block-zahl">' + teil.length + '</span></summary>' +
      '<p class="nebensache-hinweis">' + esc(b.hinweis || "") + '</p>' +
      '<div class="nebensache-inhalt">' + teil.map(karte).join("") + '</div>' +
    '</details>';
  });

  ziel.innerHTML = html;
}

const ART_NAME = {
  zahlen:"Zahlen & Fakten", bericht:"Aus den Betrieben",
  ehrung:"Ehrung", termin:"Termin"
};

function karte(m){
  /* Warum ein Datum unsicher ist, weiss die Quelle am besten - wenn sie es
     mitliefert, steht ihr Hinweis im Aufklapptext statt eines pauschalen. */
  const datum = m.datum_ungenau
    ? '<span class="ungenau" title="' + esc(m.datum_hinweis ||
        "Diese Meldung nennt kein Datum. Aus der Reihenfolge der " +
        "Übersichtsseite eingeordnet.") + '">um den ' +
      esc(datumLesbar(m.datum)) + '</span>'
    : esc(datumLesbar(m.datum));

  let klasse = "karte";
  if (istPolitisch(m)) klasse += " politisch";
  if (m.neu) klasse += " ist-neu";
  if (vonDerGegenseite(m)) klasse += " gegenseite";

  return '<article class="' + klasse + '">' +
    '<p class="karte-dach">' +
      (m.neu ? '<span class="neu-marke">Neu</span>' : '') +
      '<span class="ebene ebene-' + (m.ebene === "Bund" ? "bund" : "land") + '">' +
        esc(m.ebene) + '</span>' +
      (vonDerGegenseite(m)
        ? '<span class="gegenseite-marke">Landesregierung</span>' : '') +
      (ART_NAME[m.art]
        ? '<span class="gattung">' + esc(ART_NAME[m.art]) + '</span>' : '') +
      '<span class="thema">' + esc(m.thema) +
        (m.thema2 ? ' &middot; ' + esc(m.thema2) : '') + '</span>' +
      '<span class="datum">' + datum + '</span>' +
    '</p>' +
    '<h3 class="schlagzeile">' + esc(m.schlagzeile) + '</h3>' +
    /* Bei Terminen ist der Anrisstext der Quelle woertlich die Ueberschrift.
       Zweimal dasselbe zu lesen sieht nach Fehler aus - dann lieber nichts. */
    (m.dreizeiler && !gleicherText(m.dreizeiler, m.schlagzeile)
      ? '<p class="dreizeiler">' + esc(m.dreizeiler) +
        (m.quelle_eigen
          ? '<span class="quelle-marke">Anrisstext der Quelle</span>' : '') + '</p>'
      : '') +
    (m.zitat
      ? '<blockquote>&bdquo;' + esc(m.zitat) + '&ldquo;</blockquote>' : '') +
    '<p class="karte-fuss">' +
      '<a class="original" href="' + esc(m.url) + '" target="_blank" rel="noopener">' +
        'Zum Original</a>' +
      '<span class="absender">' + esc(m.absender) +
        (m.nummer ? ' &middot; Nr. ' + esc(m.nummer) : '') + '</span>' +
    '</p>' +
  '</article>';
}

/* ---------- Bedienung ---------- */
/* scrollIntoView statt scrollTo({behavior:"smooth"}): Das weiche Scrollen
   wird nicht ueberall ausgefuehrt - wo es fehlt, passiert dann GAR nichts,
   und der Sprung faellt stillschweigend aus. scrollIntoView springt immer;
   weich wird es ueber scroll-behavior im CSS, wo der Browser das kann. */
function zuAnker(auswahl){
  const e = document.querySelector(auswahl);
  if (e) e.scrollIntoView({block: "start"});
}

function filterSetzen(wert, springen){
  filter = (wert === filter && filter !== "alles") ? "alles" : wert;
  zeichneFilter();
  zeichneKacheln();
  zeichneListe();
  if (springen) zuAnker(".statusband");
}

document.getElementById("filterKnoepfe").addEventListener("click", function(e){
  const k = e.target.closest(".reiter");
  if (k) filterSetzen(k.dataset.filter, false);
});

document.getElementById("themenKacheln").addEventListener("click", function(e){
  const k = e.target.closest(".kachel");
  if (k) filterSetzen(k.dataset.filter, true);
});

document.getElementById("liste").addEventListener("click", function(e){
  const k = e.target.closest(".block-mehr");
  if (!k) return;
  const name = k.dataset.block;
  offeneBloecke[name] = !offeneBloecke[name];
  zeichneListe();
});

document.getElementById("suche").addEventListener("input", function(){
  suchtext = this.value.trim().toLowerCase();
  zeichneListe();
});

/* Zurueck zur Themenwahl: Wer unten in einer gefilterten Liste steht, soll
   nicht erst durch die ganze Seite nach oben scrollen muessen. */
document.getElementById("zurueck").addEventListener("click", function(){
  filter = "alles";
  document.getElementById("suche").value = "";
  suchtext = "";
  zeichneFilter();
  zeichneKacheln();
  zeichneListe();
  zuAnker("#abschnittThemen");
});

/* ---------- Faellt die Automatik aus, sagt es die Seite ----------
   Geplant ist mittwochs und freitags; der groesste normale Abstand sind
   fuenf Tage. Erst ab acht Tagen ist also wirklich etwas liegengeblieben -
   ein einzelner verpasster Lauf soll keinen Fehlalarm ausloesen. */
const GEDULD_TAGE = 8;

function tageSeit(iso){
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);
  return Math.round((heute - d) / 86400000);
}

function zeichneHaengt(){
  const el = document.getElementById("haengt");
  const tage = tageSeit(DATEN.letzter_abgleich);
  if (tage === null || tage <= GEDULD_TAGE){ el.hidden = true; return; }
  el.innerHTML = "<b>Der letzte Abgleich ist " + esc(tage) + " Tage her.</b> " +
    (DATEN.abgleich_takt
       ? "Vorgesehen ist " + esc(DATEN.abgleich_takt) + " \u2013 die Automatik " +
         "scheint nicht gelaufen zu sein."
       : "Diese Seite zeigt also m\u00f6glicherweise nicht den aktuellen Stand.");
  el.hidden = false;
}

function zeichneFuss(){
  /* Die Quellenliste zaehlt sich selbst auf. Als sie noch im Text stand,
     nannte sie nach dem Anschluss von drei weiteren Quellen immer noch
     die alten drei. */
  const namen = DATEN.meldungen.map(m => m.absender)
    /* "Gemeinsam mit Partnern" steht bei gemeinsamen Erklaerungen im Feld
       Absender - es ist aber keine Organisation und gehoert nicht in eine
       Quellenliste. */
    .filter((n, i, a) => n && n !== "Gemeinsam mit Partnern" && a.indexOf(n) === i)
    .sort((a, b) => a.localeCompare(b, "de"));
  document.getElementById("fussQuellen").innerHTML =
    "<b>Quellen:</b> " + esc(aufzaehlen(namen)) + ". Die Seite gleicht sie " +
    esc(DATEN.abgleich_takt || "regelm\u00e4\u00dfig") + " ab.";
}

/* ---------- Als App auf den Startbildschirm ----------
   Android und Chrome melden sich von selbst (beforeinstallprompt) - dann
   startet der Knopf die Installation direkt. Das iPhone kennt diesen Weg
   nicht; dort bleibt nur der Hinweis auf den Teilen-Knopf. Laeuft die Seite
   schon als App, ist der Hinweis ueberfluessig. */
const HINWEIS_WEG = "ticker-app-hinweis-weg";
let installAngebot = null;

function hinweisErlaubt(){
  try {
    if (matchMedia("(display-mode: standalone)").matches) return false;
    if (navigator.standalone) return false;
    return localStorage.getItem(HINWEIS_WEG) !== "ja";
  } catch (e){
    return true;   /* Ohne Speicher lieber einmal zu viel fragen als gar nicht */
  }
}

function hinweisWeg(){
  document.getElementById("appleiste").hidden = true;
  try { localStorage.setItem(HINWEIS_WEG, "ja"); } catch (e){}
}

function zeichneAppHinweis(){
  if (!hinweisErlaubt()) return;
  const leiste = document.getElementById("appleiste");
  const knopf = document.getElementById("appJa");
  if (installAngebot){
    document.getElementById("appText").textContent =
      /* Kurz genug fuer EINE Zeile am Handy - die Leiste bleibt dadurch
         zweizeilig statt dreizeilig. */
      "Diesen Ticker als App installieren?";
    knopf.hidden = false;
    leiste.hidden = false;
  } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)){
    document.getElementById("appText").innerHTML =
      "Als App aufs iPhone: unten auf <b>Teilen</b> tippen, dann " +
      "<b>Zum Home-Bildschirm</b>.";
    knopf.hidden = true;
    leiste.hidden = false;
  }
}

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();          /* statt Chromes eigenem Banner unser Hinweis */
  installAngebot = e;
  zeichneAppHinweis();
});
window.addEventListener("appinstalled", hinweisWeg);

document.getElementById("appJa").addEventListener("click", function(){
  if (!installAngebot) return;
  installAngebot.prompt();
  installAngebot.userChoice.then(function(){ installAngebot = null; hinweisWeg(); });
});
document.getElementById("appNein").addEventListener("click", hinweisWeg);

/* Der Service Worker macht die Seite installierbar und ohne Netz lesbar.
   Nur ueber http(s): In einer heruntergeladenen Datei (file://) gibt es ihn
   nicht - die Seite selbst funktioniert dort unveraendert. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

zeichneKopf();
zeichneHaengt();
zeichneFuss();
zeichneAppHinweis();
zeichneForderungen();
zeichneLagesatz();
zeichneKacheln();
zeichneFilter();
zeichneListe();
</script>
